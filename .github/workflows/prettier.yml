name: Prettier code formatter

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install Prettier
        run: npm install --save-dev --save-exact prettier @shopify/prettier-plugin-liquid

      - name: Collect changed files
        id: changed-files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            files=$(git diff --name-only --diff-filter=ACMRT "origin/${{ github.base_ref }}...HEAD")
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            files=$(git diff --name-only --diff-filter=ACMRT HEAD^ HEAD)
          else
            files=$(git ls-files)
          fi

          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prettier check
        id: prettier
        shell: bash
        run: |
          if [[ -z "${{ steps.changed-files.outputs.files }}" ]]; then
            echo "No changed files to check."
            exit 0
          fi

          printf '%s\n' "${{ steps.changed-files.outputs.files }}" | xargs -d '\n' npx prettier --check --ignore-unknown

      - name: Create diff
        if: ${{ failure() }}
        shell: bash
        run: |
          if [[ -n "${{ steps.changed-files.outputs.files }}" ]]; then
            printf '%s\n' "${{ steps.changed-files.outputs.files }}" | xargs -d '\n' npx prettier --write --ignore-unknown
          fi

          git diff -- . ':(exclude)package-lock.json' ':(exclude)package.json' > diff.txt
          npm install -g diff2html-cli
          diff2html -i file -s side -F diff.html -- diff.txt

      - name: Upload html diff
        id: artifact-upload
        if: ${{ failure() && steps.prettier.conclusion == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: HTML Diff
          path: diff.html
          retention-days: 7

      - name: Dispatch information to repository
        if: ${{ failure() && steps.prettier.conclusion == 'failure' && github.event_name == 'pull_request' }}
        uses: peter-evans/repository-dispatch@v2
        with:
          event-type: prettier-failed-on-pr
          client-payload: '{"pr_number": "${{ github.event.number }}", "artifact_url": "${{ steps.artifact-upload.outputs.artifact-url }}", "run_id": "${{ github.run_id }}"}'
